# Siege fixtures: six listeners matching assets/configs/siege_urls.txt.
# Run from the project root. error_pages is relative to each server root.

# Static files, MIME types, buffer boundaries, and the original smoke fixtures.
server {
	listen 8080;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/siege/static;
	error_pages error-pages;

	location / {
		allowed_methods GET;
		autoindex on;
	}

	location /smoke/ {
		root assets/www/siege/smoke;
		upload_store assets/www/siege/smoke;
		allowed_methods GET POST DELETE;
		autoindex on;
		cgi {
			.py = /usr/bin/python3;
		}
	}
}

# Directory listings and custom indexes.
server {
	listen 8081;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/siege/autoindex;
	error_pages error-pages;

	location / {
		allowed_methods GET;
		autoindex on;
	}

	location /custom_index/ {
		root assets/www/siege/autoindex/custom_index;
		allowed_methods GET;
		index landing.htm;
		autoindex on;
	}
}

# Upload, read, and delete fixtures. Other paths allow GET only.
server {
	listen 8082;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/siege/uploads;
	error_pages error-pages;

	location / {
		allowed_methods GET;
	}

	location /uploads/ {
		root assets/www/siege/uploads/uploads;
		upload_store assets/www/siege/uploads/uploads;
		allowed_methods GET POST DELETE;
		autoindex on;
	}
}

# Python CGI fixtures.
server {
	listen 8083;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/siege/cgi;
	error_pages error-pages;

	location / {
		allowed_methods GET;
	}

	location /cgi/ {
		root assets/www/siege/cgi/cgi;
		allowed_methods GET POST;
		cgi {
			.py = /usr/bin/python3;
		}
	}
}

# Location roots, longest-prefix matching, indexes, and redirects.
server {
	listen 8084;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/siege/routes;
	error_pages error-pages;

	location / {
		allowed_methods GET;
		autoindex on;
	}

	location /alias/ {
		root assets/www/siege/routes/mapped;
		allowed_methods GET;
	}

	location /alias/deep/ {
		root assets/www/siege/routes/deep_mapping;
		allowed_methods GET;
	}

	location /landing/ {
		root assets/www/siege/routes/landing;
		allowed_methods GET;
		index home.htm;
	}

	location /no-list/ {
		root assets/www/siege/routes/no-list;
		allowed_methods GET;
		autoindex off;
	}

	location /old {
		allowed_methods GET;
		return 301 /new/;
	}

	location /temporary {
		allowed_methods GET;
		return 302 /new/;
	}

	location /jump {
		allowed_methods GET;
		return 307 /new/;
	}

	location /permanent {
		allowed_methods GET;
		return 308 /new/;
	}
}

# A 1 KiB request-body limit; seed downloads are unaffected.
server {
	listen 8085;
	host 127.0.0.1;
	client_max_body_size 1K;
	root assets/www/siege/limits;
	error_pages error-pages;

	location / {
		allowed_methods GET;
	}

	location /uploads/ {
		root assets/www/siege/limits/uploads;
		upload_store assets/www/siege/limits/uploads;
		allowed_methods GET POST DELETE;
		autoindex on;
	}
}
