# Game: login on 8080; America/Africa/Europe/Oceania on 8001-8004.
# Run from the project root. error_pages is relative to the server root.
# The .penguin interpreter is relative to each regional CGI working directory.

server {
	listen 8080;
	host 127.0.0.1;
	client_max_body_size 10M;
	root assets/www/game;

	error_pages error-pages;

	location / {
		allowed_methods GET;
		index login.html;
	}

	location /cgi-bin/ {
		root assets/www/game/cgi-bin;
		allowed_methods GET POST;

		cgi {
			.py = /usr/bin/python3;
			.cgi = /usr/bin/python3;
			.php = /usr/bin/php-cgi;
		}
	}

	location /upload/ {
		root assets/www/game/uploads;
		upload_store assets/www/game/uploads;
		allowed_methods GET POST DELETE;
		autoindex on;
	}
}

